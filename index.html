<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <script>
      (function() {
        try {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#0c0a09');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>مطعم السلطان محمود - مأكولات بحرية وشاورما سورية</title>
    <meta name="description" content="الموقع الرسمي لمطعم السلطان محمود: فرع الأسماك والمأكولات البحرية والفرع السوري للمشويات والشاورما والكريب بديروط. طلب مباشر وسريع عبر واتساب وهاتف بأعلى سرعة وكفاءة." />
